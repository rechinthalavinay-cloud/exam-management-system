{% extends "base.html" %}
{% block title %}Dashboard - Examination Module{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-2">Examination Module</h1>
    <p class="text-center text-muted mb-5">Manage students, exams, and results</p>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card shadow stat-card text-center p-4">
                <h5 class="text-muted">Students</h5>
                <p class="stat-number text-primary" id="dashStudents">-</p>
                <a href="/students" class="btn btn-primary btn-sm">Manage</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow stat-card text-center p-4">
                <h5 class="text-muted">Exams</h5>
                <p class="stat-number text-success" id="dashExams">-</p>
                <a href="/exams" class="btn btn-success btn-sm">Manage</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow stat-card text-center p-4">
                <h5 class="text-muted">Results</h5>
                <p class="stat-number text-warning" id="dashResults">-</p>
                <a href="/results" class="btn btn-warning btn-sm">Manage</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow stat-card text-center p-4">
                <h5 class="text-muted">Pass Rate</h5>
                <p class="stat-number text-info" id="dashPassRate">-</p>
                <a href="/analytics" class="btn btn-info btn-sm text-white">Analytics</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const result = await API.get("/api/results/analytics");
    if (!result?.data.success) return;
    const d = result.data.data;
    document.getElementById("dashStudents").textContent = d.total_students;
    document.getElementById("dashExams").textContent = d.total_exams;
    document.getElementById("dashResults").textContent = d.total_results;
    document.getElementById("dashPassRate").textContent = d.pass_rate + "%";
});
</script>
{% endblock %}
