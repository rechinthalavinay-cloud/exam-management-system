{% extends "base.html" %}
{% block title %}Exams - Examination Module{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Exam Management</h2>

    <div class="card shadow mb-4">
        <div class="card-header bg-success text-white">Add Exam</div>
        <div class="card-body">
            <form id="addForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Exam Name</label>
                    <input type="text" name="exam_name" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Subject</label>
                    <input type="text" name="subject" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Total Marks</label>
                    <input type="number" name="total_marks" class="form-control" min="1" max="1000" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-dark text-white">Exam List</div>
        <div class="card-body table-responsive">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-success">
                    <tr>
                        <th>ID</th><th>Exam Name</th><th>Subject</th><th>Total Marks</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="examTable"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Exam</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="editForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Exam Name</label>
                        <input type="text" id="edit_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" id="edit_subject" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Total Marks</label>
                        <input type="number" id="edit_marks" class="form-control" min="1" max="1000" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/exams.js') }}"></script>
{% endblock %}
