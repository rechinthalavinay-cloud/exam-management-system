<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Exam</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">Examination Module</a>

        <div>

            <a href="/" class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/students" class="btn btn-outline-light me-2">
                Students
            </a>

            <a href="/exams" class="btn btn-outline-light me-2">
                Exams
            </a>

            <a href="/results" class="btn btn-outline-light me-2">
                Results
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</nav>

<!-- Flash Messages -->
<div class="container mt-3">

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
    {% for category, message in messages %}

        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">

            {{ message }}

            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

        </div>

    {% endfor %}
{% endif %}
{% endwith %}

</div>

<!-- Main Content -->
<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h2>Edit Exam</h2>

        </div>

        <div class="card-body">

            <form action="/update_exam/{{ exam[0] }}" method="POST">

                <div class="mb-3">

                    <label class="form-label">Exam Name</label>

                    <input
                        type="text"
                        class="form-control"
                        name="exam_name"
                        value="{{ exam[1] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Subject</label>

                    <input
                        type="text"
                        class="form-control"
                        name="subject"
                        value="{{ exam[2] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Total Marks</label>

                    <input
                        type="number"
                        class="form-control"
                        name="total_marks"
                        value="{{ exam[3] }}"
                        required>

                </div>

                <button type="submit" class="btn btn-success">
                    Update Exam
                </button>

                <a href="/exams" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
