{% extends "base.html" %}
{% block title %}Results - Examination Module{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Results Management</h2>

    <div class="card shadow mb-4">
        <div class="card-header bg-primary text-white">Add Result <small class="opacity-75">(Grade auto-calculated)</small></div>
        <div class="card-body">
            <form id="addForm" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Student</label>
                    <select name="student_id" id="student_id" class="form-select" required></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Exam</label>
                    <select name="exam_id" id="exam_id" class="form-select" required></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Marks</label>
                    <input type="number" name="marks" class="form-control" min="0" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Add Result</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-dark text-white">Results List</div>
        <div class="card-body table-responsive">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th><th>Student</th><th>Exam</th><th>Marks</th><th>%</th><th>Grade</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="resultTable"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Result</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="editForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Student</label>
                        <select id="edit_student_id" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Exam</label>
                        <select id="edit_exam_id" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Marks</label>
                        <input type="number" id="edit_marks" class="form-control" min="0" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/results.js') }}"></script>
{% endblock %}
