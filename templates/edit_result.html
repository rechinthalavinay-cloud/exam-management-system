<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">Examination Module</a>

        <div>

            <a href="/" class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/students" class="btn btn-outline-light me-2">
                Students
            </a>

            <a href="/exams" class="btn btn-outline-light me-2">
                Exams
            </a>

            <a href="/results" class="btn btn-outline-light me-2">
                Results
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</nav>

<!-- Flash Messages -->
<div class="container mt-3">

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
    {% for category, message in messages %}

    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">

        {{ message }}

        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

    </div>

    {% endfor %}
{% endif %}
{% endwith %}

</div>

<!-- Main Content -->
<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h2>Edit Result</h2>
        </div>

        <div class="card-body">

            <form action="/update_result/{{ result[0] }}" method="POST">

                <div class="mb-3">

                    <label class="form-label">Student</label>

                    <select name="student_id" class="form-select">

                        {% for student in students %}

                        <option value="{{ student[0] }}"
                        {% if student[0] == result[1] %}selected{% endif %}>
                            {{ student[1] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Exam</label>

                    <select name="exam_id" class="form-select">

                        {% for exam in exams %}

                        <option value="{{ exam[0] }}"
                        {% if exam[0] == result[2] %}selected{% endif %}>
                            {{ exam[1] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Marks</label>

                    <input
                        type="number"
                        name="marks"
                        class="form-control"
                        value="{{ result[3] }}"
                        required>

                </div>

                <button type="submit" class="btn btn-success">
                    Update Result
                </button>

                <a href="/results" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
