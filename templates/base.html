<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Examination Module{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body {% if session.get('token') %}data-token="{{ session.get('token') }}"{% endif %}>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Examination Module</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-1">Dashboard</a>
            <a href="/students" class="btn btn-outline-light btn-sm me-1">Students</a>
            <a href="/exams" class="btn btn-outline-light btn-sm me-1">Exams</a>
            <a href="/results" class="btn btn-outline-light btn-sm me-1">Results</a>
            <a href="/analytics" class="btn btn-outline-light btn-sm me-1">Analytics</a>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div id="alertBox"></div>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
